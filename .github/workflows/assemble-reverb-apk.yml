name: Assemble Reverb APK

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft release ID
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: assemble-reverb-apk-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELEASE_ID: ${{ inputs.release_id }}
      EXPECTED_SIZE: "270327060"
      EXPECTED_SHA256: 7c18e84c12ae7399ab920fd59c446fc7424584e96c3aefba227146d39e67da73
    steps:
      - name: Download and verify parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts
          gh api "repos/$REPO/releases/$RELEASE_ID" > release.json
          jq -e '.draft == true and .tag_name == "1.1.0"' release.json >/dev/null
          gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name | startswith("reverb-apk.part-")) | [.id,.name,.size,.digest] | @tsv' \
            > assets.tsv
          test "$(wc -l < assets.tsv)" -eq 17
          while IFS=$'\t' read -r id name size digest; do
            gh api "repos/$REPO/releases/assets/$id" -H 'Accept: application/octet-stream' > "parts/$name"
            test "$(stat -c%s "parts/$name")" = "$size"
            printf '%s  %s\n' "${digest#sha256:}" "parts/$name" | sha256sum -c -
          done < assets.tsv
          cat parts/reverb-apk.part-* > reverb.apk
          test "$(stat -c%s reverb.apk)" = "$EXPECTED_SIZE"
          printf '%s  reverb.apk\n' "$EXPECTED_SHA256" | sha256sum -c -

      - name: Upload assembled APK
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/releases/$RELEASE_ID" \
            --jq '.assets[]? | select(.name == "reverb.apk") | .id')
          if [ -n "$existing" ]; then
            gh api -X DELETE "repos/$REPO/releases/assets/$existing" >/dev/null
          fi
          gh release upload 1.1.0 reverb.apk --repo "$REPO"
          asset=$(gh api "repos/$REPO/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.name == "reverb.apk") | [.size,.digest,.state] | @tsv')
          test "$(printf '%s\n' "$asset" | cut -f1)" = "$EXPECTED_SIZE"
          test "$(printf '%s\n' "$asset" | cut -f2)" = "sha256:$EXPECTED_SHA256"
          test "$(printf '%s\n' "$asset" | cut -f3)" = uploaded
          printf 'VERIFIED %s\n' "$asset"

      - name: Delete uploaded parts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name | startswith("reverb-apk.part-")) | .id' \
            | while read -r id; do
                gh api -X DELETE "repos/$REPO/releases/assets/$id" >/dev/null
              done
